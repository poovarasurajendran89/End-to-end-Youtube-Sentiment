name: DVC Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "dvc.yaml"
      - "dvc.lock"
      - "params.yaml"
      - "requirements.txt"
      - "src/**"
      - ".github/workflows/dvc-pipeline.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dvc-repro:
    name: Run DVC pipeline
    runs-on: self-hosted
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      AWS_PROFILE: jcom-qa
      DVC_REMOTE_URL: s3://mlflow-tracking-bucpoo26/dvcstore
      MLFLOW_TRACKING_URI: http://ec2-54-159-40-52.compute-1.amazonaws.com:5000/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify AWS role
        run: aws sts get-caller-identity

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure DVC remote
        run: |
          dvc remote add -d myremote "$DVC_REMOTE_URL" --force

      - name: Pull existing DVC cache
        run: |
          dvc pull || true

      - name: Reproduce DVC pipeline
        run: |
          dvc repro

      - name: Push DVC outputs
        run: |
          dvc push

      - name: Show DVC status
        run: |
          dvc status
