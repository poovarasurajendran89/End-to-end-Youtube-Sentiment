
name: workflow

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: workflow-main
  cancel-in-progress: false

jobs:
  integration:
    name: Continuous Integration
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint code
        run: echo "Linting repository"

      - name: Run unit tests
        run: echo "Running unit tests"

  build-and-push-ecr-image:
    name: Continuous Delivery
    needs: integration
    runs-on: self-hosted

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Wait for apt lock
        run: |
          set -e

          for i in $(seq 1 60); do
            if sudo fuser \
              /var/lib/dpkg/lock-frontend \
              /var/lib/dpkg/lock \
              /var/lib/apt/lists/lock \
              /var/cache/apt/archives/lock \
              >/dev/null 2>&1; then
              echo "apt is busy. Waiting 5 seconds..."
              sleep 5
            else
              echo "apt locks appear available."
              break
            fi

            if [ "$i" -eq 60 ]; then
              echo "Timed out waiting for apt locks."
              exit 1
            fi
          done

      - name: Install Utilities
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y jq unzip

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

  Continuous-Deployment:
    name: Continuous Deployment
    needs: build-and-push-ecr-image
    runs-on: self-hosted

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      ECR_REGISTRY: ${{ secrets.AWS_ECR_LOGIN_URI }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull Docker Image
        run: |
          set -euo pipefail
          docker pull "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"

      - name: Stop and Remove Existing Container
        run: |
          if docker ps -q --filter "name=^/cnncls$" | grep -q .; then
            docker stop cnncls
          fi

          if docker ps -aq --filter "name=^/cnncls$" | grep -q .; then
            docker rm cnncls
          fi

      - name: Run Docker Container
        run: |
          set -euo pipefail

          docker run -d \
            --restart unless-stopped \
            -p 8080:8080 \
            --name cnncls \
            -e AWS_REGION="$AWS_REGION" \
            -e AWS_DEFAULT_REGION="$AWS_DEFAULT_REGION" \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"

      - name: Verify Container
        run: |
          sleep 5
          docker ps --filter "name=^/cnncls$"
          docker logs --tail 50 cnncls

      - name: Clean Previous Images
        if: success()
        run: docker image prune -f
